name: Lint, Build and Test

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop, "feat/**"]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Check architecture
      run: uname -m

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Show Swift version
      run: swift --version

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint

    - name: Install SwiftFormat
      run: brew install swiftformat

    - name: Check code formatting
      run: swiftformat --lint .

    - name: Install Xcbeautify
      run: brew install xcbeautify

    - name: Clean build folder
      run: xcodebuild clean -scheme ora -project Ora.xcodeproj CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          ~/.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve dependencies
      run: xcodebuild -resolvePackageDependencies -project Ora.xcodeproj

    - name: Build
      run: |
        set -o pipefail
        xcodebuild \
          -project Ora.xcodeproj \
          -scheme ora \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build | xcbeautify

    - name: Test
      run: |
        set -o pipefail
        xcodebuild \
          -project Ora.xcodeproj \
          -scheme ora \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          test | xcbeautify
