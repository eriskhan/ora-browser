name: PR3 Compile Verify

on:
  push:
    branches:
      - feat/extensions

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - name: Build
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Ora.xcodeproj \
            -scheme ora \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E '(^|: )[[:alnum:]_./ -]+\.swift:[0-9]+:[0-9]+: (error|warning):| error: ' build.log \
              | grep -v 'warning:' \
              | head -40 \
              | while IFS= read -r line; do
                  escaped=${line//'%'/'%25'}
                  escaped=${escaped//$'\n'/'%0A'}
                  escaped=${escaped//$'\r'/'%0D'}
                  echo "::error title=Xcode compiler::${escaped}"
                done
            exit "$build_status"
          fi

      - name: Test
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Ora.xcodeproj \
            -scheme ora \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee test.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            grep -E '(^|: )[[:alnum:]_./ -]+\.swift:[0-9]+:[0-9]+: (error|warning):| error: |failed|Failure' test.log \
              | head -40 \
              | while IFS= read -r line; do
                  escaped=${line//'%'/'%25'}
                  escaped=${escaped//$'\n'/'%0A'}
                  escaped=${escaped//$'\r'/'%0D'}
                  echo "::error title=Xcode tests::${escaped}"
                done
            exit "$test_status"
          fi
