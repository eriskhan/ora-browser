name: PR3 Compile Verify

on:
  push:
    branches:
      - feat/extensions

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - name: Build Ora
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Ora.xcodeproj \
            -scheme ora \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E '(^|: )[[:alnum:]_./ -]+\.swift:[0-9]+:[0-9]+: (error|warning):| error: ' build.log \
              | grep -v 'warning:' \
              | head -40 \
              | while IFS= read -r line; do
                  escaped=${line//'%'/'%25'}
                  escaped=${escaped//$'\n'/'%0A'}
                  escaped=${escaped//$'\r'/'%0D'}
                  echo "::error title=Xcode compiler::${escaped}"
                done
            exit "$build_status"
          fi

      - name: Run extension compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/ora-extension-compat"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/Sources/ExtensionCompat" "$package_dir/Tests/ExtensionCompatTests"

          cp ora/Features/Extensions/Compatibility/MozillaExtensionAPICatalog.swift \
            "$package_dir/Sources/ExtensionCompat/"
          cp ora/Features/Extensions/Compatibility/OraMozillaCompatibilityScript.swift \
            "$package_dir/Sources/ExtensionCompat/"
          cp ora/Features/Extensions/Compatibility/WebExtensionPackagePreparer.swift \
            "$package_dir/Sources/ExtensionCompat/"
          sed 's/@testable import Ora/@testable import ExtensionCompat/' \
            oraTests/WebExtensionCompatibilityTests.swift \
            > "$package_dir/Tests/ExtensionCompatTests/WebExtensionCompatibilityTests.swift"

          cat > "$package_dir/Package.swift" <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "ExtensionCompat",
              platforms: [.macOS(.v15)],
              products: [
                  .library(name: "ExtensionCompat", targets: ["ExtensionCompat"])
              ],
              dependencies: [
                  .package(url: "https://github.com/weichsel/ZIPFoundation", exact: "0.9.20")
              ],
              targets: [
                  .target(
                      name: "ExtensionCompat",
                      dependencies: [
                          .product(name: "ZIPFoundation", package: "ZIPFoundation")
                      ]
                  ),
                  .testTarget(
                      name: "ExtensionCompatTests",
                      dependencies: ["ExtensionCompat"]
                  )
              ]
          )
          EOF

          cd "$package_dir"
          swift test
